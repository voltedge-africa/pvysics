[project]
name = "pvysics"
version = "0.4.0"
description = "Physics-informed digital twin for PV state estimation: Single Diode Model, virtual plant and power-deviation state estimator"
readme = "README.md"
authors = [
    { name = "sipho-mokoena", email = "siphowilliammokoena@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "scipy>=1.18.1",
]

[project.scripts]
pvysics = "pvysics.gui.app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
# Parallel by file: a few tests crash a worker when they share one with tests from other files.
addopts = ["-n", "auto", "--dist", "loadfile", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = ["slow: takes several seconds (the bundled-day validation); deselect with -m 'not slow'"]

[tool.coverage.run]
source = ["pvysics"]

[tool.coverage.report]
fail_under = 97
show_missing = true
skip_covered = true
