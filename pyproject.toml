[project]
name = "pvysics"
version = "0.1.0"
description = "Physics-informed digital twin for PV state estimation: Single Diode Model, virtual plant and power-deviation state estimator"
readme = "README.md"
authors = [
    { name = "sipho-mokoena", email = "siphowilliammokoena@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pyqt6>=6.11.0",
    "pyqtgraph>=0.14.0",
    "scipy>=1.18.1",
]

[project.scripts]
pvysics = "pvysics.gui.app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
